name: Release

# A tag is the only automatic trigger. Pushing a branch runs CI, not this: the
# artifact a consumer pins is the one attached to a tag, built from that tag's
# Cargo.lock with the toolchain rust-toolchain.toml names, so there is no
# question of which build a given version is.
#
# **Artifacts are written once.** A tag that already has them fails rather than
# replacing them. A consumer that recorded a digest and a tag has recorded
# something that cannot quietly become different bytes later; if a release is
# wrong, the answer is another tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach to (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # rust-toolchain.toml decides this, not the date the workflow runs. A
      # rebuild of a tag has to produce the bytes that tag shipped.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version
          rustup target list --installed

      - name: Install wasm-bindgen-cli, at the version the crate pins
        run: |
          want=$(grep -o '"=0\.2\.[0-9]*"' crates/gguf-wasm/Cargo.toml | tr -d '"=')
          echo "pinned: $want"
          cargo install wasm-bindgen-cli --version "$want" --locked

      - name: Test
        run: |
          cargo test --release --locked --workspace
          cargo test --release --locked -p f2i-gguf --features std

      - name: Check it still builds without std
        run: cargo build --release --locked --target wasm32-unknown-unknown

      - name: Package
        run: cargo package --workspace --locked --exclude gguf-examples

      - name: Build the module
        run: sh scripts/build-wasm.sh

      - name: Smoke-test it
        run: node scripts/smoke.mjs

      - name: Bundle
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          for target in pkg pkg-node; do
            cp README.md LICENSE-MIT LICENSE-APACHE "$target/"
          done
          cp js/index.mjs pkg/index.mjs
          # Deterministic archives: same inputs, same bytes. `tar -z` stamps
          # the gzip header with the current time and tar records each file's
          # mtime, owner and whatever order readdir returned, so an identical
          # tree would otherwise produce a different digest on every run --
          # which makes the digests a consumer pins unverifiable by rebuild.
          for target in web:pkg node:pkg-node; do
            name="${target%%:*}"; dir="${target##*:}"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cf - -C "$dir" . | gzip -n > "dist/gguf-wasm-$name-$version.tar.gz"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      # Written once. A consumer pins a tag and a digest together, so replacing
      # what a tag points at would make that pin a lie.
      - name: Refuse to replace what a tag already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          if gh release view "$version" --json assets -q '.assets[].name' 2>/dev/null | grep -q .; then
            echo "$version already has assets. A release is written once; cut another tag." >&2
            gh release view "$version" --json assets -q '.assets[].name' >&2
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          gh release view "$version" >/dev/null 2>&1 \
            || gh release create "$version" --title "$version" --generate-notes
          gh release upload "$version" dist/*.tar.gz dist/SHA256SUMS

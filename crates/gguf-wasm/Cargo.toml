[package]
name = "f2i-gguf-wasm"
description = "GGUF reading, block dequantization and tokenization in a browser, through wasm-bindgen."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# The library name is what wasm-bindgen writes out, so the module stays
# `gguf_wasm.js` and `gguf_wasm_bg.wasm` regardless of the package name.
name = "gguf_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
gguf.workspace = true
gguf-quants.workspace = true
gguf-tokenizer.workspace = true
# Pinned exactly: the generated bindings must match the wasm-bindgen CLI that
# post-processes them, so the version here and the CLI in the release workflow
# move together or not at all.
wasm-bindgen = "=0.2.126"

[package]
# Published as `f2i-gguf`; the library is `gguf`, so a consumer aliases the
# package and `use gguf::...` reads the same either way. The unprefixed name
# belongs to an unrelated crate on crates.io.
name = "f2i-gguf"
description = "GGUF container reading: metadata, tensor shapes and the byte range of every tensor. Works without std."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "gguf"
path = "src/lib.rs"

[dependencies]
gguf-quants.workspace = true

[features]
default = []
# Opening a file, and reading tensors out of it by range. Without this the
# crate parses a header it is handed and never touches a filesystem, which is
# what a browser needs.
std = ["gguf-quants/std"]
